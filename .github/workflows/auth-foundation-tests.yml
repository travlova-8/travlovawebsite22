name: Auth foundation tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/secure-account-recovery]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run auth foundation tests
        run: npm test
